name: Python Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install base dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q ai vocal music mixing separation utils app.py

      - name: Import smoke test
        run: |
          python - <<'PY'
          from app import build_app
          from ai.arrangement_generator import generate_ai_conditioned_arrangement
          from ai.conditioned_music import condition_vocal_to_music
          from ai.musicgen_melody import MusicGenConfig
          from ai.pitch_timing_ai import correct_pitch_timing_ai
          from ai.song_builder import SongBuilderConfig, SongSection, build_song_sketch
          print("✅ app import")
          print("✅ conditioned music import")
          print("✅ arrangement import")
          print("✅ pitch/timing import")
          print("✅ MusicGen backend import")
          print("✅ Song Builder import")
          print("✅ build_app symbol:", callable(build_app))
          print("✅ arrangement symbol:", callable(generate_ai_conditioned_arrangement))
          print("✅ conditioning symbol:", callable(condition_vocal_to_music))
          print("✅ pitch/timing symbol:", callable(correct_pitch_timing_ai))
          print("✅ Song Builder symbol:", callable(build_song_sketch))
          print("✅ Song Builder config:", SongBuilderConfig(sections=(SongSection("Intro", 2),)))
          print("✅ MusicGen config:", MusicGenConfig())
          PY
