name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "release-*"

jobs:
  build-release-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Verify EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error title=Missing EXPO_TOKEN::Add the Expo access token as the EXPO_TOKEN GitHub repository secret."
            exit 1
          fi

          echo "EXPO_TOKEN is configured."

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          npx eas-cli@latest project:info

      - name: Typecheck
        run: npm run typecheck

      - name: Build Release APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          npx eas-cli@latest build \
            --platform android \
            --profile release \
            --non-interactive \
            --wait \
            --json > eas-build.json

          cat eas-build.json

      - name: Extract EAS build ID
        id: eas-build
        run: |
          set -euo pipefail

          BUILD_ID="$(node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("eas-build.json", "utf8"));

            const build =
              Array.isArray(data) ? data[0] :
              data.builds?.[0] ?? data;

            if (!build?.id) {
              console.error("Could not find EAS build ID.");
              process.exit(1);
            }

            process.stdout.write(build.id);
          ')"

          echo "Build ID: $BUILD_ID"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          npx eas-cli@latest build:download \
            --build-id "${{ steps.eas-build.outputs.build_id }}" \
            --output ./JE-AI-Audio-Studio-release.apk

          test -f ./JE-AI-Audio-Studio-release.apk

          echo "APK created successfully:"
          ls -lh ./JE-AI-Audio-Studio-release.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JE-AI-Audio-Studio-release-apk
          path: mobile/JE-AI-Audio-Studio-release.apk
          if-no-files-found: error
          retention-days: 30
